<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>가까운 화장실</title>
  <meta name="description" content="지금 열려 있는 가장 가까운 공중화장실 (행정안전부 공공데이터)">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="주변 화장실 지도"></div>

  <ul class="legend" aria-label="핀 설명">
    <li><span class="legend-mark me" aria-hidden="true"></span>내 위치</li>
    <li><span class="legend-mark open" aria-hidden="true">✓</span>열림</li>
    <li><span class="legend-mark unknown" aria-hidden="true">?</span>확인 필요</li>
    <li><span class="legend-mark closed" aria-hidden="true">✕</span>닫힘</li>
  </ul>

  <section id="sheet" class="sheet" aria-live="polite">
    <button type="button" id="grab" class="grab"></button>
    <div id="card" class="card">
      <p class="status-line">가까운 화장실을 찾는 중…</p>
    </div>
    <footer id="source" class="source">데이터: 행정안전부</footer>
  </section>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=6ooj1gt0gd"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
